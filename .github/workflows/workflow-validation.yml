name: Workflow validation

on:
  pull_request:
    paths: ["agents/**", "skills/**", "prompts/**", "workflows/**", "settings.yml", ".pre-commit-config.yaml", "scripts/**"]
  push:
    branches: [main]
    paths: ["agents/**", "skills/**", "prompts/**", "workflows/**", "settings.yml", ".pre-commit-config.yaml", "scripts/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-outfitter/outfitter
          ref: v1.16.0
          path: .ci/outfitter
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: .ci/outfitter/package-lock.json}
      - run: npm ci
        working-directory: .ci/outfitter
      - run: npm run build
        working-directory: .ci/outfitter
      - run: scripts/validate-workflows.sh "$GITHUB_WORKSPACE/.ci/outfitter/code/cli/dist/cli.js"
