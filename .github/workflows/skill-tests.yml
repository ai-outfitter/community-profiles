name: Skill tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run skill test scripts
        run: |
          shopt -s nullglob
          status=0
          for t in skills/*/scripts/*.test.sh skills/*/tests/*.test.sh; do
            echo "== $t"
            bash "$t" || status=1
          done
          exit "$status"
